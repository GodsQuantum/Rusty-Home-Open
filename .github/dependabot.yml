# Public-repository dependency maintenance. All changes require normal CI.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    groups:
      rust-nonbreaking:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(rust)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    groups:
      actions-nonbreaking:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(actions)"
