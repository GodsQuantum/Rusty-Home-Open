# Public-repository dependency maintenance. All changes require normal CI.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    ignore:
      # Major API changes require a dedicated migration PR and explicit review.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      rust-nonbreaking:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(rust)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    ignore:
      # Prevent unattended major action upgrades from breaking CI contracts.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
    groups:
      actions-nonbreaking:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps(actions)"
