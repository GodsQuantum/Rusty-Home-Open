name: P8as Explicit localhost-only TCP ingress for rootless OCI App
on:
  pull_request:
    paths:
      - ".github/workflows/p8as-oci-localhost-tcp.yml"
      - "scripts/test_p8as_localhost_contract.py"
      - "scripts/test_p8ar_native_oci_manager.sh"
      - "scripts/test_p8ar_manager_contract.py"
      - "crates/native-hub/**"
      - "Cargo.lock"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-loopback-tcp:
    name: Real OCI Redis exposed ONLY on 127.0.0.1 with native rootless Podman
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Guard unauthorized execution and unsafe manifests
        run: |
          python3 scripts/test_p8ar_manager_contract.py
          python3 scripts/test_p8as_localhost_contract.py
          cargo fmt --all -- --check
          cargo test --locked -p hars-native-hub --all-targets
          cargo clippy --locked -p hars-native-hub --all-targets -- -D warnings
          bash -n scripts/test_p8ar_native_oci_manager.sh
      - name: Install official rootless Podman and user systemd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap slirp4netns fuse-overlayfs
          test -x /usr/bin/podman
          test -S /run/user/$(id -u)/bus
      - name: Genuine Redis accessible on localhost only, native Podman inspect and socket PING
        timeout-minutes: 12
        run: |
          cargo build --locked -p hars-native-hub --bin oci_app_manager_lab
          HARS_LOCAL_TCP_LAB=1 bash scripts/test_p8ar_native_oci_manager.sh
