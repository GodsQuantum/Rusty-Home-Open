name: P8av Two distinct OCI applications running under generic Rust manager
on:
  pull_request:
    paths:
      - ".github/workflows/p8av-real-two-oci-apps.yml"
      - "scripts/test_p8av_two_real_apps_contract.py"
      - "scripts/test_p8av_real_two_distinct_apps.sh"
      - "scripts/test_p8ar_native_oci_manager.sh"
      - "scripts/test_p8ar_manager_contract.py"
      - "crates/native-hub/src/oci_quadlet.rs"
      - "crates/native-hub/src/bin/oci_app_manager_lab.rs"
      - "crates/native-hub/src/bin/oci_quadlet_lab.rs"
      - "crates/native-hub/src/lib.rs"
      - "crates/native-hub/Cargo.toml"
      - "crates/native-hub/build.rs"
      - "crates/native-hub/tests/**"
      - "Cargo.lock"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-unrelated-oci-apps:
    name: Redis persistent plus Memcached ephemeral independent lifecycle under identical Rust manager
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Guard unauthorized execution and unsafe manifests
        run: |
          python3 scripts/test_p8ar_manager_contract.py
          python3 scripts/test_p8av_two_real_apps_contract.py
          cargo fmt --all -- --check
          cargo test --locked -p hars-native-hub --all-targets
          cargo clippy --locked -p hars-native-hub --all-targets -- -D warnings
          bash -n scripts/test_p8ar_native_oci_manager.sh
      - name: Install official rootless Podman and user systemd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap slirp4netns fuse-overlayfs
          test -x /usr/bin/podman
          test -S /run/user/$(id -u)/bus
      - name: Two different real OCI App engines execute independently with no host ports
        timeout-minutes: 12
        run: |
          cargo build --locked -p hars-native-hub --bin oci_app_manager_lab
          bash scripts/test_p8av_real_two_distinct_apps.sh
