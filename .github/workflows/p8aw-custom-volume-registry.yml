name: P8aw OCI App custom volume path with genuine Docker Distribution registry storage
on:
  pull_request:
    paths:
      - ".github/workflows/p8aw-custom-volume-registry.yml"
      - "scripts/test_p8aw_data_path_contract.py"
      - "scripts/test_p8aw_real_registry_custom_volume.sh"
      - "scripts/test_p8ax_registry_independent_restore.sh"
      - "scripts/test_p8ax_independent_registry_restore_contract.py"
      - "scripts/p8aw_registry_http_proof.py"
      - "scripts/test_p8ar_native_oci_manager.sh"
      - "scripts/test_p8ar_manager_contract.py"
      - "crates/native-hub/**"
      - "Cargo.lock"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-stateful-http-registry:
    name: Rust manager runs real Distribution registry HTTP with custom persistent OCI volume
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Guard unauthorized execution and unsafe manifests
        run: |
          python3 scripts/test_p8ar_manager_contract.py
          python3 scripts/test_p8aw_data_path_contract.py
          python3 scripts/test_p8ax_independent_registry_restore_contract.py
          cargo fmt --all -- --check
          cargo test --locked -p hars-native-hub --all-targets
          cargo clippy --locked -p hars-native-hub --all-targets -- -D warnings
          bash -n scripts/test_p8aw_real_registry_custom_volume.sh
          bash -n scripts/test_p8ax_registry_independent_restore.sh
          python3 -m py_compile scripts/p8aw_registry_http_proof.py
      - name: Install official rootless Podman and user systemd
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap slirp4netns fuse-overlayfs
          test -x /usr/bin/podman
          test -S /run/user/$(id -u)/bus
      - name: Genuine HTTP artifact upload and read after Registry restart at custom named volume
        timeout-minutes: 12
        run: |
          cargo build --locked -p hars-native-hub --bin oci_app_manager_lab
          bash scripts/test_p8aw_real_registry_custom_volume.sh
