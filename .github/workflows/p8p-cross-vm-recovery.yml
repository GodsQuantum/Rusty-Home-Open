name: P8p Fresh second HAOS QEMU recovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/p8p-cross-vm-recovery.yml"
      - "scripts/p8p_cross_vm_backup_pytest.py"
      - "scripts/fixtures/p8be_haos_automations.yaml"
      - "scripts/p8p_cross_vm_backup_relay.py"
      - "scripts/check_p8p_cross_vm_junit.py"
      - "scripts/test_p8p_cross_vm_contract.py"
permissions:
  contents: read
concurrency:
  group: p8p-fresh-vm-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fresh-restore:
    name: Fresh second genuine HAOS 18.3 KVM recovery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check QEMU isolation and evidence contracts
        run: |
          python3 scripts/test_p8p_cross_vm_contract.py
          python3 scripts/test_certification_evidence_registry.py
      - name: Prepare pinned Home Assistant OS upstream QEMU harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf xz-utils jq
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/home-assistant/operating-system.git "$RUNNER_TEMP/haos-upstream"
          git -C "$RUNNER_TEMP/haos-upstream" fetch -q --depth 1 origin 90fa213c3441e585d5a60387e9244d0ed38efaf8
          git -C "$RUNNER_TEMP/haos-upstream" checkout -q 90fa213c3441e585d5a60387e9244d0ed38efaf8
          git -C "$RUNNER_TEMP/haos-upstream" sparse-checkout set tests
          test "$(git -C "$RUNNER_TEMP/haos-upstream" rev-parse HEAD)" = 90fa213c3441e585d5a60387e9244d0ed38efaf8
          python3 -m venv "$RUNNER_TEMP/haos-venv"
          "$RUNNER_TEMP/haos-venv/bin/python" -m pip install -r "$RUNNER_TEMP/haos-upstream/tests/requirements.txt"
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /usr/share/ovmf/OVMF.fd
      - name: Verify official immutable HAOS 18.3 QEMU image
        run: |
          curl -fLSs --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/haos_ova-18.3.qcow2.xz" https://github.com/home-assistant/operating-system/releases/download/18.3/haos_ova-18.3.qcow2.xz
          cd "$RUNNER_TEMP"
          echo "fae6a728768cc10aff60d4820bfcd40d64cd77fab82c8bd92af13b3d9d414090  haos_ova-18.3.qcow2.xz" | sha256sum -c
          xz -T2 -dc haos_ova-18.3.qcow2.xz > haos-upstream/tests/haos.qcow2
          rm haos_ova-18.3.qcow2.xz
          qemu-img resize -f qcow2 haos-upstream/tests/haos.qcow2 64G
          qemu-img info --output=json haos-upstream/tests/haos.qcow2 | jq -e '.[ "virtual-size" ] >= 68719476736'
      - name: Source guest backup and separate fresh target guest restoration
        timeout-minutes: 42
        run: |
          set -euo pipefail
          grep -q -- '-snapshot -accel kvm' "$RUNNER_TEMP/haos-upstream/tests/qemu-strategy.yaml"
          sed -i 's/memory: 1G/memory: 3G/' "$RUNNER_TEMP/haos-upstream/tests/qemu-strategy.yaml"
          cat "$GITHUB_WORKSPACE/scripts/p8p_cross_vm_backup_pytest.py" >> "$RUNNER_TEMP/haos-upstream/tests/supervisor_test/test_supervisor.py"
          mkdir -p "$RUNNER_TEMP/hars-cross-vm"
          python3 "$GITHUB_WORKSPACE/scripts/p8p_cross_vm_backup_relay.py" --output-dir "$RUNNER_TEMP/hars-cross-vm" > "$RUNNER_TEMP/relay.log" 2>&1 &
          RELAY_PID=$!
          trap 'kill "$RELAY_PID" 2>/dev/null || true' EXIT
          source "$RUNNER_TEMP/haos-venv/bin/activate"
          cd "$RUNNER_TEMP/haos-upstream/tests"
          ./run_tests.sh supervisor_test/test_supervisor.py::test_start_supervisor supervisor_test/test_supervisor.py::test_check_supervisor supervisor_test/test_supervisor.py::test_hars_cross_vm_source
          python3 "$GITHUB_WORKSPACE/scripts/check_p8p_cross_vm_junit.py" junit_reports/tests.xml source
          test -s "$RUNNER_TEMP/hars-cross-vm/archive.tar"
          test -s "$RUNNER_TEMP/hars-cross-vm/manifest.json"
          ./run_tests.sh supervisor_test/test_supervisor.py::test_start_supervisor supervisor_test/test_supervisor.py::test_check_supervisor supervisor_test/test_supervisor.py::test_hars_cross_vm_target
          python3 "$GITHUB_WORKSPACE/scripts/check_p8p_cross_vm_junit.py" junit_reports/tests.xml target
          echo P8BF_DIRECT_HAOS_TO_FRESH_HAOS_AUTOMATION_SOURCE_RESTORED_PASS
          echo P8P_CROSS_VM_SOURCE_TO_FRESH_TARGET_OFFICIAL_HAOS_PASS
