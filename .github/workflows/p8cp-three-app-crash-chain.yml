name: P8cp genuine three-App dependency crash fencing
on:
  pull_request:
    paths:
      - ".github/workflows/p8cp-three-app-crash-chain.yml"
      - "scripts/test_p8cp_three_app_crash_chain.sh"
      - "scripts/test_p8cp_three_app_contract.py"
      - "crates/native-hub/src/oci_quadlet.rs"
      - "crates/native-hub/src/bin/oci_app_manager_lab.rs"
      - "Cargo.lock"
permissions:
  contents: read
jobs:
  three-app-crash-chain:
    name: Three rootless Redis Apps, root SIGKILL, dependent fencing and durable recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Strict scope and Rust regression
        run: |
          python3 scripts/test_p8cp_three_app_contract.py
          bash -n scripts/test_p8cp_three_app_crash_chain.sh
          cargo fmt --all -- --check
          cargo test --locked -p hars-native-hub --all-targets
          cargo clippy --locked -p hars-native-hub --all-targets -- -D warnings
      - name: Disposable native rootless Podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap slirp4netns fuse-overlayfs
          test -S /run/user/$(id -u)/bus
      - name: Real three-App root crash cascade and recovery
        timeout-minutes: 13
        run: |
          cargo build --locked -p hars-native-hub --bin oci_app_manager_lab
          bash scripts/test_p8cp_three_app_crash_chain.sh
