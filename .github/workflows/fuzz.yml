name: Rusty Home - instrumented Core, ingress and Supervisor Store fuzz

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
      - "crates/supervisor-apps/src/core_user_snapshot_lab.rs"
      - "crates/control-plane/src/ingress.rs"
      - "crates/supervisor-apps/src/official_store.rs"
      - "crates/supervisor-apps/src/operation_preflight.rs"
      - "crates/supervisor-apps/src/store_availability.rs"
      - "scripts/test_p15_fuzz_workflow_contract.py"
      - "scripts/test_p15_haos_backup_fuzz_contract.py"
      - "crates/interop-moli/src/ha_backup_import.rs"
      - "crates/interop-moli/src/app_backup_import.rs"
      - "scripts/test_p8cz_app_backup_fuzz_contract.py"
      - "crates/interop-moli/src/registry_stage.rs"
      - "scripts/test_p15_disabled_automation_fuzz_contract.py"
      - "crates/native-kernel/src/automation_yaml.rs"
      - "crates/native-kernel/src/automation_moli.rs"

permissions:
  contents: read

concurrency:
  group: p15-libfuzzer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-core-user:
    name: Core auth, ingress and Store security (libFuzzer / AddressSanitizer)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 immutable pin
        with:
          persist-credentials: false
      - name: Pinned nightly and instrumented fuzzer
        run: |
          rustup toolchain install nightly-2026-10-15 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
          cargo fuzz --version
      - name: Ensure synthetic corpus only, without production secrets
        run: |
          python3 scripts/test_p15_fuzz_workflow_contract.py
          python3 scripts/test_p15_haos_backup_fuzz_contract.py
          python3 scripts/test_p15_disabled_automation_fuzz_contract.py
          python3 scripts/test_p8cz_app_backup_fuzz_contract.py
          test -f fuzz/corpus/core_user_snapshot/valid-admin-user.json
          test -f fuzz/corpus/ingress_http/trusted-read.bin
          test -f fuzz/corpus/supervisor_store/v2-installed.bin
          test -f fuzz/corpus/lifecycle_preflight/consistent-install.bin
          test -f fuzz/Cargo.lock
          test -f fuzz/corpus/haos_backup_import/synthetic-valid-full.bin
          test -f fuzz/corpus/disabled_haos_automation/disabled-synthetic.yaml
          test -f fuzz/corpus/app_backup_import/valid-two-fictional-apps.tar
      - name: Execute real sanitizer-instrumented libFuzzer smoke
        working-directory: fuzz
        run: |
          cargo +nightly-2026-10-15 fuzz run core_user_snapshot -- -max_total_time=45 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run ingress_http -- -max_total_time=45 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run supervisor_store -- -max_total_time=45 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run lifecycle_preflight -- -max_total_time=45 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run haos_backup_import -- -max_total_time=45 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run disabled_haos_automation -- -max_total_time=45 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run app_backup_import -- -max_total_time=45 -max_len=65536 -timeout=8 -rss_limit_mb=2048
      - name: Extended sanitizer fuzz of all protected surfaces
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: fuzz
        run: |
          cargo +nightly-2026-10-15 fuzz run core_user_snapshot -- -max_total_time=180 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run ingress_http -- -max_total_time=180 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run supervisor_store -- -max_total_time=180 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run lifecycle_preflight -- -max_total_time=180 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run haos_backup_import -- -max_total_time=180 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run disabled_haos_automation -- -max_total_time=180 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run app_backup_import -- -max_total_time=180 -max_len=65536 -timeout=8 -rss_limit_mb=2048
      - name: Attach crash artifacts only if instrumented run failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 verified GitHub tag
        with:
          name: core-ingress-store-fuzzer-failure
          path: |
            fuzz/artifacts/core_user_snapshot/
            fuzz/artifacts/ingress_http/
            fuzz/artifacts/supervisor_store/
            fuzz/artifacts/lifecycle_preflight/
            fuzz/artifacts/haos_backup_import/
            fuzz/artifacts/disabled_haos_automation/
            fuzz/artifacts/app_backup_import/
          retention-days: 7
          if-no-files-found: ignore
