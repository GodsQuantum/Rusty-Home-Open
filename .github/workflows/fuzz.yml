name: Rusty Home - instrumented Core, ingress and Supervisor Store fuzz

on:
  schedule:
    - cron: "47 2 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
      - "crates/supervisor-apps/src/core_user_snapshot_lab.rs"
      - "crates/control-plane/src/ingress.rs"
      - "crates/supervisor-apps/src/official_store.rs"
      - "scripts/test_p15_fuzz_workflow_contract.py"

permissions:
  contents: read

concurrency:
  group: p15-libfuzzer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-core-user:
    name: Core auth, ingress and Store security (libFuzzer / AddressSanitizer)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 immutable pin
        with:
          persist-credentials: false
      - name: Pinned nightly and instrumented fuzzer
        run: |
          rustup toolchain install nightly-2026-10-15 --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
          cargo fuzz --version
      - name: Ensure synthetic corpus only, without production secrets
        run: |
          python3 scripts/test_p15_fuzz_workflow_contract.py
          test -f fuzz/corpus/core_user_snapshot/valid-admin-user.json
          test -f fuzz/corpus/ingress_http/trusted-read.bin
          test -f fuzz/corpus/supervisor_store/v2-installed.bin
          test -f fuzz/Cargo.lock
      - name: Execute real sanitizer-instrumented libFuzzer smoke
        working-directory: fuzz
        run: |
          cargo +nightly-2026-10-15 fuzz run core_user_snapshot -- -max_total_time=45 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run ingress_http -- -max_total_time=45 -timeout=8 -rss_limit_mb=2048
          cargo +nightly-2026-10-15 fuzz run supervisor_store -- -max_total_time=45 -timeout=8 -rss_limit_mb=2048
      - name: Attach crash artifacts only if instrumented run failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 verified GitHub tag
        with:
          name: core-ingress-store-fuzzer-failure
          path: |
            fuzz/artifacts/core_user_snapshot/
            fuzz/artifacts/ingress_http/
            fuzz/artifacts/supervisor_store/
          retention-days: 7
          if-no-files-found: ignore
