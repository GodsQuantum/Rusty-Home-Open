name: Expanded genuine HACS on official Core
on:
  schedule:
    - cron: "27 2 * * 1"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-hacs-wave2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  card-builder-and-smart:
    name: Genuine Card Builder 2.6.0 and Smart Announcements 0.8.3
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Public privacy guard
        run: python3 scripts/test_public_redaction.py
      - name: Card Builder upstream release asset and real Core config lifecycle
        run: bash scripts/run_p6g_real_card_builder_core.sh
      - name: Smart Announcements true Core config lifecycle
        run: bash scripts/run_p6f_real_smart_core.sh
  adaptive-and-universal:
    name: Genuine Adaptive Lighting 1.32.0 and Universal Media Player 1.9.0
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Public privacy guard
        run: python3 scripts/test_public_redaction.py
      - name: Adaptive Lighting true Core config lifecycle with switches
        run: bash scripts/run_p6f_real_adaptive_core.sh
      - name: Universal Media Player pinned public release with real Core
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/run_p6h_universal_core.sh
  epson-no-device:
    name: Genuine Epson SNMP 0.1.3 Core, missing device fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Public privacy guard
        run: python3 scripts/test_public_redaction.py
      - name: Genuine pinned Epson SNMP config entry refuses absent device
        run: bash scripts/run_p6j_real_epson_core.sh
