name: P8ap Real rootless Redis OCI App lifecycle via Rust-generated Quadlet
on:
  pull_request:
    paths:
      - ".github/workflows/p8ap-real-oci-app.yml"
      - "scripts/test_p8ap_real_redis_quadlet.sh"
      - "scripts/test_p8ap_real_oci_contract.py"
      - "crates/native-hub/src/oci_quadlet.rs"
      - "crates/native-hub/src/bin/oci_app_manager_lab.rs"
      - "crates/native-hub/src/bin/oci_quadlet_lab.rs"
      - "crates/native-hub/src/lib.rs"
      - "crates/native-hub/Cargo.toml"
      - "crates/native-hub/build.rs"
      - "crates/native-hub/tests/**"
      - "Cargo.lock"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-rootless-app:
    name: Native Rust generated Quadlet starts, restarts and retains real Redis OCI App data
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Strict generic OCI security and negative input tests
        run: |
          python3 scripts/test_p8ap_real_oci_contract.py
          cargo fmt --all -- --check
          cargo test --locked -p hars-native-hub --all-targets
          cargo clippy --locked -p hars-native-hub --all-targets -- -D warnings
          bash -n scripts/test_p8ap_real_redis_quadlet.sh
      - name: Use official Ubuntu Podman and rootless OCI runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap slirp4netns fuse-overlayfs
          test -x /usr/bin/podman
          test -S /run/user/$(id -u)/bus
      - name: Genuine Redis OCI App two starts with persistent data in native rootless Quadlet
        timeout-minutes: 12
        run: |
          cargo build --locked -p hars-native-hub --bin oci_quadlet_lab
          bash scripts/test_p8ap_real_redis_quadlet.sh
