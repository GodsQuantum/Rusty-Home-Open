name: Official Home Assistant Core interoperability labs
on:
  schedule:
    - cron: "17 2 * * 1"
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-labs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  official-core-to-rust:
    name: Genuine Core 2026.10.2 to isolated Rust HTTP bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Reject leaked data and device ownership
        run: python3 scripts/test_public_redaction.py
      - name: Real Core 1232 state objects, UDS capability and fail-closed HTTP 503
        run: bash scripts/test_core_control_plane_e2e.sh
      - name: Genuine Core 2026.10.2 config-entry flow setup unload remove lifecycle
        run: |
          python3 scripts/test_p6c_config_entry_lifecycle_contract.py
          bash scripts/run_config_entry_lifecycle_core.sh
      - name: Genuine Core storage entity registry to durable private Rust read-only shadow and rollback
        run: |
          python3 scripts/test_p8q_core_registry_contract.py
          bash scripts/run_p8q_real_core_to_native_registry.sh
      - name: Verify no test container leaked
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep '^hars-core-ui-'; then
            echo 'Isolated Core test container leaked'; exit 1
          fi
  genuine-core-ws-moli:
    name: Genuine Core authenticated WebSocket to actual Moli Hub (no egress)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Fail-closed isolation, official Core auth and pinned image contracts
        run: |
          python3 scripts/test_p8v_official_core_ws_contract.py
          cargo test --locked -p hars-ha-compat --lib session::tests::bounded_retry
          python3 scripts/test_public_redaction.py
          python3 scripts/test_ha_core_pins.py
      - name: Official Home Assistant Core authenticated WS events into native Moli read-only Hub
        run: bash scripts/run_p8v_genuine_core_ws_to_moli.sh
      - name: No leaked genuine Core WebSocket sandbox
        if: always()
        run: |
          if docker ps -a --format '{{.Names}}' | grep '^hars-p8v-'; then
            echo 'Genuine Core WebSocket sandbox leaked'; exit 1
          fi
  genuine-hacs-components:
    name: Three pinned HACS integrations inside official Core (isolated)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject leaked data and device ownership
        run: python3 scripts/test_public_redaction.py
      - name: Watchman 0.8.4 pinned upstream Core config-flow lifecycle
        run: bash scripts/run_p6d_real_watchman_core.sh
      - name: Blueprint Studio 2.5.2 real Core admin versus user API policy
        run: bash scripts/run_p6k_real_blueprint_core.sh
      - name: CUP Component 1.5.0 real released asset Core sensor updates
        run: bash scripts/run_p6l_real_cup_core.sh
      - name: Verify no known test network survived
        if: always()
        run: |
          if docker network ls --format '{{.Name}}' | grep -E '^hars-p6(k|l)-'; then
            echo 'Isolated Core test network leaked'; exit 1
          fi
