name: P8cs genuine native pair coordinator SIGKILL and recovery
on:
  pull_request:
    paths:
      - ".github/workflows/p8cs-durable-pair-start.yml"
      - "scripts/test_p8cs_durable_pair_start.sh"
      - "scripts/test_p8cs_durable_pair_contract.py"
      - "crates/native-hub/src/bin/oci_app_manager_lab.rs"
      - "crates/native-hub/src/oci_quadlet.rs"
      - "Cargo.lock"
permissions:
  contents: read
jobs:
  crash-recovery:
    name: Genuine disposable rootless Redis pair coordinator SIGKILL recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Scope, syntax and Rust regression
        run: |
          python3 scripts/test_p8cs_durable_pair_contract.py
          bash -n scripts/test_p8cs_durable_pair_start.sh
          cargo fmt --all -- --check
          cargo test --locked -p hars-native-hub --all-targets
          cargo clippy --locked -p hars-native-hub --all-targets -- -D warnings
      - name: Rootless native OCI runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap slirp4netns fuse-overlayfs
          test "$(podman info --format '{{.Host.CgroupsVersion}}')" = v2
          test -S /run/user/$(id -u)/bus
      - name: Genuine crash and new-process recovery
        timeout-minutes: 13
        run: |
          cargo build --locked -p hars-native-hub --bin oci_app_manager_lab
          bash scripts/test_p8cs_durable_pair_start.sh
