name: Real isolated Rusty Home dashboard screenshot
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/lab-ui-screenshot.yml"
      - "scripts/capture_branding_lab.mjs"
      - "web/index.html"
permissions:
  contents: read
jobs:
  synthetic-real-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use preinstalled Google Chrome on ubuntu-24.04 (no browser downloads)
        run: |
          command -v google-chrome
          google-chrome --version
          mkdir -p runtime/brandshot
          npm --prefix runtime/brandshot install --no-audit --no-fund playwright@1.57.0
      - name: Render real web frontend with fictional Apps
        env:
          RUSTY_HOME_CHROME_CHANNEL: chrome
        run: node scripts/capture_branding_lab.mjs
      - name: Ensure source contains only synthetic sample inventory
        run: python3 scripts/test_public_redaction.py
      - name: Upload screenshot (real HTML, no real household)
        uses: actions/upload-artifact@v4
        with:
          name: rusty-home-isolated-synthetic-dashboard
          path: |
            branding/lab-dashboard.png
            branding/lab-dashboard-mobile.png
          if-no-files-found: error
          retention-days: 7
