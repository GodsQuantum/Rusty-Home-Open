name: P8az Real native OCI App secret reference under rootless Podman
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/p8az-oci-secret.yml"
      - "scripts/test_p8az_native_oci_secret.sh"
      - "crates/native-hub/src/oci_quadlet.rs"
      - "crates/native-hub/src/bin/oci_app_manager_lab.rs"
      - "crates/native-hub/src/lib.rs"
      - "crates/native-hub/Cargo.toml"
      - "crates/native-hub/tests/**"
      - "Cargo.lock"
permissions:
  contents: read
jobs:
  real-native-secret:
    name: Real rootless Redis consumes pre-provisioned Podman secret without leaking material
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify declarative secret input, native binary and Rust safety
        run: |
          bash -n scripts/test_p8az_native_oci_secret.sh
          cargo fmt --all -- --check
          cargo test --locked -p hars-native-hub --all-targets
          cargo clippy --locked -p hars-native-hub --all-targets -- -D warnings
      - name: Official Podman generator and rootless OCI runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends podman uidmap slirp4netns fuse-overlayfs
          test -S "/run/user/$(id -u)/bus"
      - name: Real existing native secret gets mounted inside running OCI App
        timeout-minutes: 12
        run: |
          cargo build --locked -p hars-native-hub --bin oci_app_manager_lab
          bash scripts/test_p8az_native_oci_secret.sh
