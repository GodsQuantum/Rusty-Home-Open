name: Rusty Home public CI
on:
  schedule:
    - cron: "07 2 * * 1"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-rust-and-security-labs:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format, full Rust workspace and strict clippy
        run: |
          cargo fmt --all -- --check
          cargo test --locked --all
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Preview-only Core plus Ingress RBAC, no privileged transport
        run: |
          python3 scripts/test_p8i_core_user_rbac_contract.py
          cargo test --locked -p hars-supervisor-apps --features core-user-rbac-lab --lib
          cargo clippy --locked -p hars-supervisor-apps --all-targets --features core-user-rbac-lab -- -D warnings
      - name: Active Core account, trusted ingress and durable one-shot consent preview
        run: |
          python3 scripts/test_core_corroborated_preview_contract.py
          cargo test --locked -p hars-supervisor-apps --features core-corroborated-preview-lab --lib core_corroborated_permit_lab
          cargo clippy --locked -p hars-supervisor-apps --all-targets --features core-corroborated-preview-lab -- -D warnings
      - name: Durable lab session bounds, atomic revocation and replay protection
        run: |
          python3 scripts/test_p8i_durable_contract.py
          cargo test --locked -p hars-supervisor-apps --features persistent-session-lab --test p8i_durable_sessions
          cargo clippy --locked -p hars-supervisor-apps --all-targets --features persistent-session-lab -- -D warnings
      - name: Generic lifecycle evidence on 1017 unknown vendors, no write permit
        run: |
          python3 scripts/test_lifecycle_preflight_contract.py
          cargo test --locked -p hars-supervisor-apps --lib operation_preflight
      - name: Universal official Supervisor App catalog paging/search (1317 unknown Apps)
        run: python3 scripts/test_generic_supervisor_catalog_cli.py
      - name: Live Store repository selector contract and adversarial 1317-App filtering
        run: |
          python3 scripts/test_store_repository_filter_contract.py
          node scripts/test_dynamic_store_repository_filter.mjs
      - name: Test the isolated 9-App migration policy
        run: python3 scripts/test_app_migration_policy.py
      - name: Synthetic inventory and loopback HTTP integration
        run: |
          bash scripts/test-lab.sh
          bash scripts/smoke-http.sh
          bash scripts/smoke-supervisor-live.sh
          bash scripts/smoke-supervisor-ingress.sh
      - name: Native Supervisor administrator Ingress remains read-only
        run: python3 scripts/test_supervisor_ingress_groups_contract.py
      - name: P19 real TCP slow-client worker admission
        run: |
          cargo build --locked -p ha-rust-bridge
          python3 scripts/test_p19_bounded_http_workers.py
      - name: P20 Linux flock interprocess denial and SIGKILL recovery
        run: |
          cargo build --locked -p hars-native-kernel
          python3 scripts/test_p20_radio_exclusivity.py
      - name: Native bearer-auth daemon, state persistence and restart
        run: python3 scripts/test_native_daemon_http.py
      - name: Durable command idempotency and real crash quarantine
        run: |
          python3 scripts/test_durable_command_kill9.py
          python3 scripts/test_native_reconciliation.py
      - name: Stalled old-controller epoch fenced after SIGSTOP
        run: python3 scripts/test_native_fencing.py
      - name: Offline MQTT discovery and safe YAML automation compiler
        run: |
          python3 scripts/test_native_mqtt_discovery.py
          python3 scripts/test_native_automation_yaml.py
      - name: Real generated dashboard screenshots (desktop and mobile)
        run: python3 scripts/test_branding_assets.py
      - name: Check RustSec dependency audit workflow remains fail-closed
        run: python3 scripts/test_rustsec_audit_workflow_contract.py
      - name: Check all Core laboratory OCI digests track latest pinned stable
        run: python3 scripts/test_ha_core_pins.py
      - name: All eight first-party Rust crates explicitly declare MIT and are nonpublishable
        run: python3 scripts/test_firstparty_license_manifests.py
      - name: Public fixtures and source privacy check
        run: python3 scripts/test_public_redaction.py
      - name: Verify public certification gate ledger
        run: python3 scripts/test_public_certification_ledger.py
      - name: Review-signed, non-forgeable release evidence only (synthetic test keys)
        run: |
          python3 scripts/test_release_gate_attestation.py
      - name: Verify pinned lab evidence is scoped and not a production signoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/verify_lab_evidence.py
          python3 scripts/test_lab_evidence_truth.py
          python3 scripts/test_release_gate_evidence_truth.py
          python3 scripts/test_online_evidence_truth.py
          python3 scripts/verify_lab_evidence_online.py
      - name: Assert no deployment authorization
        run: python3 scripts/check_release_gate.py --expect-blocked
