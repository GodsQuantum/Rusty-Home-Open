name: P8eh native Rust Supervisor delegated MQTT auth boundary (offline lab)
on:
  pull_request:
    paths:
      - ".github/workflows/p8eh-mqtt-supervisor-delegated-auth-lab.yml"
      - "crates/supervisor-apps/src/mqtt_supervisor_auth_lab.rs"
      - "crates/supervisor-apps/tests/p8eh_mqtt_supervisor_auth.rs"
      - "crates/supervisor-apps/src/lib.rs"
      - "crates/supervisor-apps/Cargo.toml"
      - "scripts/test_p8eh_mqtt_supervisor_auth_contract.py"
      - "Cargo.lock"
permissions:
  contents: read
jobs:
  official-auth-boundary-lab:
    name: Real Rust loopback Supervisor POST auth, good/bad/forged/timeouts deny
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Ensure feature-gated, no daemon, no real HAOS token or network egress
        run: |
          python3 scripts/test_p8eh_mqtt_supervisor_auth_contract.py
          cargo fmt --all -- --check
          cargo clippy --locked -p hars-supervisor-apps --features mqtt-supervisor-auth-lab --all-targets -- -D warnings
      - name: Actually POST over local TCP to mock Supervisor and check deny on outage
        run: |
          cargo test --locked -p hars-supervisor-apps --features mqtt-supervisor-auth-lab --test p8eh_mqtt_supervisor_auth -- --nocapture
      - name: Confirm normal default supervisor-app crate remains optional-feature-free
        run: |
          cargo check --locked -p hars-supervisor-apps --no-default-features --quiet
