[package]
name = "hars-supervisor-apps"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Read-only dynamic Home Assistant Supervisor app repository inspector"

[features]
# Default read-only durable job watch state; NOT an authorization receipt.
default = ["durable-job-watch"]
durable-job-watch = ["dep:redb"]
# This gated proof may mutate only the fixture App core_ssh on disposable HAOS.
# Default builds contain NO supervisor lifecycle write code.
lab-app-actions = []
# Preview API operations are disabled in the default production build.
managed-apps-preview = ["dep:getrandom", "dep:sha2"]
# Explicit test-only ACID state; no production IdP or gateway.
persistent-session-lab = ["managed-apps-preview", "dep:redb"]
# Pure claim verifier only; no user authentication and no HTTP listener.
ingress-identity-lab = []
# Information-only Core user status; fixture WS result, no trusted IdP.
core-user-snapshot-lab = ["ingress-identity-lab"]
# Fixed-target Core WS reader; read-only, never grants lifecycle writes.
core-user-live-readonly = ["core-user-snapshot-lab", "dep:tungstenite"]
# QEMU-only probe remains gated independently for existing laboratory tests.
core-user-live-lab = ["core-user-live-readonly"]
# Preview-only join of trusted ingress claim, fresh Core user state and
# per-App policy. No network, no HTTP endpoint, no write transport.
core-user-rbac-lab = ["core-user-snapshot-lab", "managed-apps-preview"]
# Dedicated QEMU-only composition: live Core corroboration, per-App grants,
# persisted single-use confirmation, owner-only durable audit, no HTTP writes.
core-corroborated-preview-lab = ["core-user-live-readonly", "persistent-session-lab"]
# LAB-only crash-consistent one-dispatch-per-App guard, no product mutations.
durable-dispatch-fence-lab = ["managed-apps-preview", "dep:redb"]
# Still QEMU/lab-only: bind corroborated current Core admin to durable App intent.
core-durable-dispatch-lab = ["core-corroborated-preview-lab", "durable-dispatch-fence-lab"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "=2.0.0"
nix = { version = "0.31", features = ["user"] }
getrandom = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
redb = { version = "4.4.0", optional = true }
tungstenite = { version = "0.29", default-features = false, features = ["handshake"], optional = true }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "guest_supervisor_lab_lifecycle"
required-features = ["lab-app-actions"]

[[example]]
name = "guest_supervisor_managed_preview"
required-features = ["managed-apps-preview"]

[[example]]
name = "guest_core_users_probe"
required-features = ["core-user-live-lab"]

[[example]]
name = "guest_supervisor_verified_async_install"
required-features = ["durable-dispatch-fence-lab"]

[[example]]
name = "guest_supervisor_verified_sync_install"
required-features = ["durable-dispatch-fence-lab"]
