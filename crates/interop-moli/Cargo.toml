[package]
name = "hars-interop-moli"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Experimental lossless Home Assistant to Moli OS typed identity adapter"

[dependencies]
moli-core = { git = "https://github.com/rudy-io/moli-os.git", rev = "d54c3de46aa453691f0c96ddc42e853a8a964178" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
redb = "=4.4.0"
anyhow = "1"
nix = { version = "0.31", features = ["user"] }

tempfile = "3"
