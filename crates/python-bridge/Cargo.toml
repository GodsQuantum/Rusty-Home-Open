[package]
name = "hars-python-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Read-only Python sidecar Unix socket client, isolated laboratory"

[dependencies]
anyhow = "1"
nix = { version = "0.31", features = ["socket"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
