[package]
name = "hars-native-kernel"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Standalone Rust-native synthetic home automation integration milestone"

[dependencies]
moli-core = { git = "https://github.com/rudy-io/moli-os.git", rev = "d54c3de46aa453691f0c96ddc42e853a8a964178" }
moli-runtime = { git = "https://github.com/rudy-io/moli-os.git", rev = "d54c3de46aa453691f0c96ddc42e853a8a964178" }
moli-automation = { git = "https://github.com/rudy-io/moli-os.git", rev = "d54c3de46aa453691f0c96ddc42e853a8a964178" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread","macros","time","sync","net","io-util","signal"] }
tokio-util = "0.7"
anyhow = "1"
tempfile = "3"
subtle = "2.6"
redb = "=4.4.0"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "=2.0.0"
nix = { version = "0.31", features = ["user", "fs"] }
rumqttc = { package = "rumqttc-v4-next", version = "=0.34.0", default-features = false }
rumqttc5 = { package = "rumqttc-v5-next", version = "=0.34.0", default-features = false }
